# Prometheus configuration for the Docker Compose deployment.
# Metrics are only exposed on the internal Compose network; publish them
# through an authenticated observability gateway for remote scraping.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: omnisource-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
