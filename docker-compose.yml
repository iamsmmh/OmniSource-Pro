# Production-oriented local Compose topology for OmniSource.
#
# 1. cp .env.example .env
# 2. replace every REQUIRED value (see docs/DEPLOYMENT.md)
# 3. docker compose up -d --build
#
# PostgreSQL, Redis, Meilisearch, Prometheus, and Grafana are intentionally
# private to the Compose network. Put the API behind a TLS reverse proxy or
# managed load balancer; never publish the data-service ports to the Internet.

x-omnisource-env: &omnisource-env
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  MEILISEARCH_URL: http://meilisearch:7700
  MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?set MEILISEARCH_MASTER_KEY}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  API_KEYS: ${API_KEYS:?set API_KEYS}
  API_CORS_ORIGINS: ${API_CORS_ORIGINS:?set API_CORS_ORIGINS}
  FEED_SIGNING_PRIVATE_KEY: ${FEED_SIGNING_PRIVATE_KEY:?set FEED_SIGNING_PRIVATE_KEY}
  FEED_SIGNING_PUBLIC_KEY: ${FEED_SIGNING_PUBLIC_KEY:-}
  FEED_ALLOW_EPHEMERAL_SIGNING: "false"
  FEEDS_DIR: /app/data/feeds

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [omnisource]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [omnisource]

  meilisearch:
    image: getmeili/meilisearch:v1.5
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?set MEILISEARCH_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [omnisource]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: "no"
    env_file: .env
    environment: *omnisource-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [omnisource]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment: *omnisource-env
    volumes:
      - app_data:/app/data
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health/ready', timeout=5).raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks: [omnisource]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment: *omnisource-env
    volumes:
      - app_data:/app/data
    command: ["celery", "-A", "omnisource.automation.worker", "worker", "--loglevel", "info"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [omnisource]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment: *omnisource-env
    volumes:
      - app_data:/app/data
    command: ["python", "main.py", "scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [omnisource]

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      api:
        condition: service_started
    networks: [omnisource]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    networks: [omnisource]

volumes:
  app_data:
  postgres_data:
  redis_data:
  meilisearch_data:
  prometheus_data:
  grafana_data:

networks:
  omnisource:
    driver: bridge
