version: '3.8'

# OmniSource Docker Compose Configuration
# Run with: docker-compose up -d

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: omnisource-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnisource
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d omnisource"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - omnisource

  # ============================================
  # Redis for Caching and Message Queue
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: omnisource-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - omnisource

  # ============================================
  # Meilisearch for Full-Text Search
  # ============================================
  meilisearch:
    image: getmeili/meilisearch:v1.5
    container_name: omnisource-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: change-me-in-production
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - omnisource

  # ============================================
  # OmniSource API Server
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: omnisource-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/omnisource
      REDIS_URL: redis://redis:6379/0
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: change-me-in-production
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      GH_TOKEN: ${GH_TOKEN:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health/live', timeout=5).raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - omnisource

  # ============================================
  # OmniSource Worker for Background Jobs
  # ============================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: omnisource-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/omnisource
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      GH_TOKEN: ${GH_TOKEN:-}
    volumes:
      - ./data:/app/data
    command: ["celery", "-A", "omnisource.automation.worker", "worker", "--loglevel", "info"]
    networks:
      - omnisource

  # ============================================
  # OmniSource Scheduler for Periodic Jobs
  # ============================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: omnisource-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/omnisource
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      GH_TOKEN: ${GH_TOKEN:-}
    volumes:
      - ./data:/app/data
    command: ["celery", "-A", "omnisource.automation.worker", "beat", "--loglevel", "info"]
    networks:
      - omnisource

  # ============================================
  # Optional: Prometheus for Metrics
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: omnisource-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - omnisource

  # ============================================
  # Optional: Grafana for Dashboards
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: omnisource-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    networks:
      - omnisource

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  prometheus_data:
  grafana_data:

# ============================================
# Networks
# ============================================
networks:
  omnisource:
    driver: bridge
