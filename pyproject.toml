[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "omnisource"
version = "0.1.0"
description = "Autonomous open-source software discovery, indexing, validation, metadata, and feed platform"
authors = ["OmniSource Team"]
license = "AGPL-3.0"
readme = "README.md"
packages = [{include = "omnisource"}]

[tool.poetry.dependencies]
python = "^3.11"
# Web Framework
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
# Database
sqlalchemy = "^2.0.23"
asyncpg = "^0.29.0"
alembic = "^1.13.0"
# HTTP Client
httpx = "^0.26.0"
# Async
anyio = "^4.0.0"
# Search
meilisearch = "^0.28.0"
# Task Queue
celery = "^5.3.4"
redis = "^5.0.1"
# Retry
tenacity = "^8.2.3"
# Validation
jsonschema = "^4.20.0"
# Security
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
# CLI
click = "^8.1.7"
rich = "^13.7.0"
# Utilities
pytz = "^2024.1"
python-dateutil = "^2.8.2"
# Type checking
mypy = "^1.8.0"
# Linting
ruff = "^0.1.14"
# Testing
pytest = "^7.4.3"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
hypothesis = "^6.92.0"
# HTTP testing
httpx-mock = "^0.0.6"

[tool.poetry.group.dev.dependencies]
# Development tools
ipython = "^8.18.0"
ipdb = "^0.13.13"

[tool.poetry.extras]
dev = ["mypy", "ruff", "pytest", "pytest-asyncio", "pytest-cov", "pytest-mock", "hypothesis"]

[tool.ruff]
# Enable Pyflakes, pycodestyle, and isort
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "TID", # flake8-tidy-imports
    "PL",  # Pylint
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "PLR0913", # Too many arguments
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
]
line-length = 100
target-version = "py311"

[tool.ruff.isort]
known-first-party = ["omnisource"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["omnisource"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
