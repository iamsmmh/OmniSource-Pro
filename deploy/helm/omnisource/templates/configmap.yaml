apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omnisource.fullname" . }}
  labels:
    {{- include "omnisource.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  API_CORS_ORIGINS: {{ .Values.corsOrigins | quote }}
